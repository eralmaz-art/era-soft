name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Compile Python sources
        run: python -m compileall -q era_soft scripts tests
      - name: Run repository tests
        run: python -m unittest discover -s tests -v
