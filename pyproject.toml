[project]
name = "era_soft"
authors = [
  { name = "ERA Group" },
]
description = "Construction and ready-mix concrete ERP extensions for ERA Group"
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[project.urls]
Repository = "https://github.com/eralmaz-art/era-soft.git"

[build-system]
requires = ["flit_core>=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.format]
indent-style = "tab"
quote-style = "double"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP", "W"]
